# Render Blueprint: free Docker web service (512 MB RAM, sleeps after 15 min idle).
# Render dashboard -> New -> Blueprint -> pick this repo, then fill in the secret values (sync: false).
services:
  - type: web
    name: ai-investigation-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # gemini-3.5-flash allows only 20 requests/day on the free tier; flash-lite keeps the demo usable
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
